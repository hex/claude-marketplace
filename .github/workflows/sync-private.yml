# Starts the sync in hex/claude-marketplace-private after every push to main, so the claude.ai org
# plugin sync (which takes private repos only) sees changes within a minute.
name: Sync the private copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the private repo's sync
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SYNC_TOKEN }}
        # The REST call needs only the token's Actions permission; `gh workflow run` also reads the default branch.
        run: gh api -X POST repos/hex/claude-marketplace-private/actions/workflows/sync.yml/dispatches -f ref=main
